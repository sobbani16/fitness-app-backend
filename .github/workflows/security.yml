name: security

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to match test.yml — floating @v2 caused version skew; GITHUB_TOKEN
      # is required for PR-mode scanning (without it the action dies right after
      # the license check on pull_request events).
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deps:
    name: dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on unreviewed high/critical production advisories; the allowlist
      # (docs/security-audit/known-advisories.json) requires id+reason+date.
      - run: node scripts/audit-gate.js

  config-guards:
    name: fail-closed config guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dev-secret fallbacks must only appear inside requiredSecret() calls
        # Precise matcher (scripts/check-dev-secret-guard.js): same rules as the
        # original grep — literal outside requiredSecret() = raw fallback = fail,
        # payments mock exemption unchanged — but no longer false-positives on
        # the PREDICTABLE denylist definition in src/lib/env.js (data, not
        # usage). Regression-tested in tests/devSecretGuard.test.js.
        run: node scripts/check-dev-secret-guard.js
      - name: payment webhook route has a dedicated rate limiter
        run: grep -q "rateLimit" src/routes/paymentWebhooks.js
      - name: provider binding check present
        run: grep -q "verifyEventMatchesPurchase\|provider mismatch" src/services/trainerCommerceService.js
      - name: disabled-commerce webhook gate present
        run: grep -q "commerce_disabled" src/services/trainerCommerceService.js

  behavioral:
    name: production-config behavioral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Proves (not greps) that prod config rejects unsafe defaults: mock
      # provider refused, predictable secrets rejected, missing secrets throw.
      - run: npm ci
      - run: npx jest tests/securityHardening.test.js --runInBand
